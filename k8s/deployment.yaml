apiVersion: apps/v1
kind: Deployment
metadata:
  name: systemlab21-deployment
  namespace: default
  labels:
    app: systemlab21-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: systemlab21-api
  template:
    metadata:
      labels:
        app: systemlab21-api
    spec:
      containers:
      - name: api
        image: localhost/systemlab21:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "10Mi"
            cpu: "250m"
          limits:
            memory: "200Mi"
            cpu: "500m"
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  namespace: default
  name: systemlab21-svc
  labels:
    app: systemlab21-api
spec:
  type: NodePort
  ports:
  - port: 3000
    protocol: TCP
    targetPort: 3000
    nodePort: 30123
  selector:
    app: systemlab21-api 
status:
  loadBalancer: {}
